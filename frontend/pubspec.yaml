name: dentaguru
description: Enterprise-grade Multi-Vendor Dental Healthcare Platform Mobile Client
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing & Navigation
  go_router: ^12.1.3

  # Local Persistence & Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # API Networking
  http: ^1.2.0

  # Biometric Auth Security
  local_auth: ^2.1.8

  # Firebase — Push Notifications & Core
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0

  # Media & File Picker
  image_picker: ^1.1.2

  # Dynamic Visual Assets
  flutter_spinkit: ^5.2.0
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/dentaguru_logo.png
    - assets/dentaguru_tooth_icon.png
    - assets/dentaguru_tooth_icon_transparent.png
