services:
  - type: web
    name: dentaguru-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        value: dentaguru_super_secret_jwt_key_2026
      - key: REFRESH_SECRET
        value: dentaguru_super_secret_refresh_key_2026
