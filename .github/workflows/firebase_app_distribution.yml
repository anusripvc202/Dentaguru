name: DentaGuru Build & Test Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Android APK & Verify Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Get Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: 5. Run Flutter Tests
        run: |
          cd frontend
          flutter test

      - name: 6. Build Android APK
        run: |
          cd frontend
          flutter build apk --debug
