name: DentaGuru Build & Distribution Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for testers'
        required: false
        default: 'Automated test build distribution via GitHub Actions'

jobs:
  build-and-test:
    name: Build Android APK & Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Get Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: 5. Run Flutter Unit & Widget Tests
        run: |
          cd frontend
          flutter test

      - name: 6. Build Android APK
        run: |
          cd frontend
          flutter build apk --debug

      - name: 7. Distribute APK via Firebase App Distribution (Optional)
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" != ''
        continue-on-error: true
        uses: w9jds/firebase-action@v11.16.0
        with:
          args: appdistribution:distribute frontend/build/app/outputs/flutter-apk/app-debug.apk --app "${{ secrets.FIREBASE_APP_ID_ANDROID || '1:653454456380:android:5d3a32eaa156d75470b539' }}" --release-notes "${{ github.event.inputs.release_notes || 'Automated build from commit ' }}${{ github.sha }}"
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
